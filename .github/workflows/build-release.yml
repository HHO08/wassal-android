name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant wrapper execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Tag short name
        id: meta
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Wassal ${{ steps.meta.outputs.TAG }}
          body: |
            Direct P2P calling app for Android.

            - Voice over WebRTC (Opus 48 kHz)
            - Screen share & 1080p60 recording
            - Chat & voice notes (AAC/m4a)
            - Local-only storage, one permission (microphone)

            Note: this is the signed debug-signature build so it can be
            installed straight from the browser. For store publishing, sign it
            with your own keystore.
          files: |
            app/build/outputs/apk/release/*.apk
